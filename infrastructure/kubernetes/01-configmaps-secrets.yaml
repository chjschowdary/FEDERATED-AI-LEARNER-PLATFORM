apiVersion: v1
kind: ConfigMap
metadata:
  name: federaicloud-config
  namespace: federaicloud
data:
  ENVIRONMENT: "production"
  STORAGE_BACKEND: "s3"
  S3_BUCKET_NAME: "federaicloud-artifacts"
  S3_ENDPOINT_URL: "http://storage-service:8333"
  AWS_REGION: "us-east-1"
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: federaicloud-secrets
  namespace: federaicloud
type: Opaque
stringData:
  DATABASE_URL: "postgresql://federai:federai_secure_pass_2026@postgres-service:5432/federaicloud"
  JWT_SECRET: "FEDERAI-CLOUD-SUPER-SECURE-SECRET-KEY-PROD-ENVIRONMENT"
  AWS_ACCESS_KEY_ID: "seaweedadmin"
  AWS_SECRET_ACCESS_KEY: "seaweedsecurepass2026"
