global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "federai-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: "federai-seaweedfs"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["seaweedfs:9333"]
